[project]
name = "mcp-auth"
version = "0.1.0"
description = "Single-user OAuth 2.1 authorization server with DCR, PKCE and TOTP"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1",
    "joserfc>=1.7",
    "cryptography>=46",
    "argon2-cffi>=25",
    "pyotp>=2.10",
    "qrcode>=8.2",
    "gunicorn>=26",
]

[project.scripts]
mcp-auth = "mcp_auth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_auth"]
