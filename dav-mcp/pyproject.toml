[project]
name = "dav-mcp"
version = "0.1.0"
description = "Read-only MCP server for CalDAV calendars and CardDAV address books"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0.0,<4.0.0",
    "caldav>=3.2",
    "vobject>=0.9.9",
    "httpx>=0.28",
]

[project.scripts]
dav-mcp = "dav_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dav_mcp"]
