[project]
name = "imap-mcp"
version = "0.1.0"
description = "Read-focused MCP server for multiple IMAP mailboxes with hybrid live/indexed search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0.0,<4.0.0",
    "imapclient>=3.1",
]

[project.scripts]
imap-mcp = "imap_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imap_mcp"]
